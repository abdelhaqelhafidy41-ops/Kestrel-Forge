name: CI Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-lint-build:
    name: Typecheck, Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: TypeScript typecheck
        run: bun run lint

      - name: Validate products.config.json
        run: bunx tsx scripts/validate-products.ts

      - name: Build frontend and server bundle
        run: bun run build
