name: Sync GitHub Releases

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-releases:
    name: Refresh GitHub Release Snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync GitHub Releases metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/sync-releases.ts

      - name: Commit snapshot updates if changed
        run: |
          if [ -n "$(git status --porcelain data/releases-snapshot.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/releases-snapshot.json
            git commit -m "chore(releases): update GitHub release metadata snapshot"
            git push
          else
            echo "No release changes detected."
          fi
