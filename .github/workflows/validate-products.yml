name: Validate Product Catalog

on:
  push:
    branches: [main]
    paths:
      - 'products.config.json'
      - 'scripts/validate-products.ts'
      - 'src/assets/images/**'
  pull_request:
    paths:
      - 'products.config.json'
      - 'scripts/validate-products.ts'
      - 'src/assets/images/**'

jobs:
  validate-catalog:
    name: Validate Product Definitions & Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate products.config.json
        run: bunx tsx scripts/validate-products.ts
